plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
}

def appVersionCode = 350
def appVersionStep = (int) (appVersionCode / 10)
def appVersionName = "1.${(int) (appVersionStep / 10)}.${appVersionStep % 10}"

def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'com.enddream.keybox'
    compileSdk 37

    defaultConfig {
        applicationId 'com.enddream.keybox'
        minSdk 28
        targetSdk 37
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks.storeFile)
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation compose.ui
    implementation compose.foundation
    implementation compose.material3
    implementation compose.materialIconsExtended
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'dev.chrisbanes.haze:haze:1.7.3'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
}
